name: Supermove
kind: company
description: Supermove is a cloud-based moving company operating system that manages
  the full job lifecycle for residential and commercial movers - sales and booking,
  estimating, dispatch and operations, a field crew app, storage, payments, and
  accounting. Supermove's public developer surface is intentionally narrow. Rather
  than a general REST platform API for jobs, customers, estimates, or invoices, the
  documented public integration is a single inbound "Developer API" - a per-account
  New Lead Endpoint. Each Supermove account exposes its own unique webhook URL, and
  upstream lead providers or a company's own website POST lead data as JSON
  (Content-Type application/json) to that URL to create leads/projects. The endpoint
  URL itself scopes the payload to the account, so no separate API keys or
  organization identifiers are used. Broader platform data and product
  integrations (QuickBooks Online, HubSpot, Stripe, Google Calendar, Zapier,
  Thumbtack, and other lead providers) are handled through Supermove's own
  connectors rather than a general outbound public API. Access is not self-serve;
  Supermove is sold via demo and custom quote.
