  description: The one documented public Supermove API. Each Supermove account
    exposes a unique per-account webhook URL; a lead provider or the company's own
    website POSTs a lead as JSON to that URL to create a new lead/project. The
    payload follows a documented JSON schema with a project_type plus client,
    billing_client, and jobs objects (contacts, locations, and lead metadata); most
    fields are optional. Authentication is by possession of the account-specific
    endpoint URL - no API key or organization identifier is sent. This surface is
    inbound only (lead ingestion); it does not read or manage jobs, dispatch,
    estimates, crews, or invoices. Endpoints are modeled in OpenAPI from the public
    Help Center documentation because the concrete host is a per-account URL that is
    not published.
