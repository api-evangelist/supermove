actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Supermove's only documented public API is
    an inbound HTTP webhook (the New Lead Endpoint), which is request/response over
    HTTPS. No AsyncAPI document was created because there is no server-push
    transport on any Supermove API to model.
